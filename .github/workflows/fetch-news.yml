name: Fetch news

on:
  schedule:
    # Runs at the top of every hour. GitHub's schedule can drift a few
    # minutes under load -- that's normal and fine for this use case.
    - cron: '0 * * * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run RSS fetch pipeline
        run: node scripts/fetch-news.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update news data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
